name: Deploy to GitHub Pages

on:
  # Runs on every push to main branch
  push:
    branches: ['main']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ── 1. Build ──────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        env:
          # Set BASE_PATH if GitHub Pages serves from /repo-name/
          BASE_PATH: ${{ github.event.repository.name }}
        run: |
          # Build into a custom folder instead of default 'dist'
          npm run build
          mv dist build-output

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build-output

  # ── 2. Deploy ─────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
